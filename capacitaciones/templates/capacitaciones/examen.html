{% extends 'capacitaciones/base.html' %}

{% block content %}
<div class="container py-5">
    <h2 class="fw-bold text-center mb-4">Examen Final: {{ curso.titulo }}</h2>
    
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <form method="POST" class="card shadow-sm p-4">
                {% csrf_token %}
                <h5 class="fw-bold mb-3">Responde las siguientes preguntas:</h5>
                
                <!-- Aquí irían tus preguntas desde la base de datos o un formulario estático -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">1. ¿Cuál es el objetivo principal del módulo 1?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="p1" value="a" id="p1a">
                        <label class="form-check-label" for="p1a">Opción A</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="p1" value="b" id="p1b">
                        <label class="form-check-label" for="p1b">Opción B</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Enviar Respuestas</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
