<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Capacitaciones</title>
    <!-- CSS de Bootstrap para los estilos visuales -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <!-- Encabezado con Botones -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Cursos Disponibles</h2>
            <div>
                <a href="{% url 'canjear_codigo' %}" class="btn btn-outline-secondary me-2">Tengo un código B2B</a>
                <a href="{% url 'mis_cursos' %}" class="btn btn-primary">Mis Cursos</a>
            </div>
        </div>

        <hr class="mb-4">

        <!-- Lista de Tarjetas de Cursos -->
        <div class="row">
            {% for curso in cursos %}
                <div class="col-md-4 mb-4">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-dark">{{ curso.titulo }}</h5>
                            <p class="card-text text-muted my-3">{{ curso.descripcion|truncatewords:25 }}</p>
                            <h3 class="text-success fw-bold">${{ curso.precio_b2c }} <small class="fs-6 text-muted">ARS</small></h3>
                        </div>
                        <div class="card-footer bg-white border-top-0 pb-3">
                            <a href="{% url 'comprar_curso' curso.id %}" class="btn btn-success w-100 fw-bold">
                                Comprar Curso
                            </a>
                        </div>
                    </div>
                </div>
            {% empty %}
                <div class="col-12">
                    <div class="alert alert-info text-center">No hay cursos disponibles para compra individual en este momento.</div>
                </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
