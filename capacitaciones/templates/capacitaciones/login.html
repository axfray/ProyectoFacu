<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 450px;">
        <div class="card shadow-sm border-0 mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center fw-bold mb-4">Iniciar Sesión</h3>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuario o contraseña incorrectos. Inténtalo de nuevo.
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">Usuario</label>
                        <input type="text" name="username" class="form-control" id="id_username" required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2">Ingresar</button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'home' %}" class="text-decoration-none text-secondary">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
